[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Rules-based IBKR day-trading bot for stocks and crypto, supervised by an AI agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ib_async>=2.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
